%YAML:1.0

tracker:
  tracker-width: 640
  tracker-height: 384
  gpu-id: 0
  # Using the pure IOU tracker library
  tracker-ll-lib-file: "/opt/nvidia/deepstream/deepstream/lib/libnvds_nvioutracker.so"
  # Using the official IOU config as a base
  tracker-ll-config-file: "/opt/nvidia/deepstream/deepstream/samples/configs/deepstream-app/config_tracker_IOU.yml"
  enable-batch-process: 1
  enable-past-frame: 0   # IOU doesn't support past-frame re-id
  display-tracking-id: 1

# Note: The following blocks are ignored by the pure IOU library 
# but we keep them here as placeholders for your app parser.
TargetManagement:
  minDetectorConfidence: 0.15
  maxTargetsPerStream: 150
  minTrackerConfidence: 0.3
  probationAge: 2
  maxShadowTrackingAge: 30
  earlyTerminationAge: 1
