%YAML:1.0

tracker:
  tracker-width: 640
  tracker-height: 384
  gpu-id: 0
  tracker-ll-lib-file: "/opt/nvidia/deepstream/deepstream/lib/libnvds_nvmultiobjecttracker.so"
  # Using the performance-optimized NvDCF profile
  tracker-ll-config-file: "/opt/nvidia/deepstream/deepstream/samples/configs/deepstream-app/config_tracker_NvDCF_perf.yml"
  enable-batch-process: 1
  enable-past-frame: 1
  display-tracking-id: 1

TargetManagement:
  minDetectorConfidence: 0.2
  maxTargetsPerStream: 150
  minTrackerConfidence: 0.7
  probationAge: 3
  maxShadowTrackingAge: 30
  earlyTerminationAge: 1

DataAssociation:
  distanceMetric: 2             # Cosine distance
  matchingThreshold: 0.5
  minMatchingConfidence: 0.6
