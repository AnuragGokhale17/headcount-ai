# mediamtx.yml - Minimalist version
logLevel: info

# RTSP server (where DeepStream pushes the video)
rtsp: yes
rtspAddress: :8554

# WebRTC server (where your browser gets the video)
webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigins: ["*"]

# Paths - Leave this empty or use 'all' with no sub-fields.
# This allows any publisher to create any stream name.
paths:
  all: