services:
  redis:
    image: redis:7-alpine
    container_name: headcount_redis
    expose:
      - "6379"
    restart: unless-stopped

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: headcount_mediamtx
    ports:
      - "8889:8889" # WebRTC
      - "8554:8554" # RTSP
      - "8190:8189/udp" # WebRTC ICE (Host port changed to 8190)
    volumes:
      - ./deepstream/mediamtx.yml:/mediamtx.yml
    restart: unless-stopped

  deepstream:
    image: nvcr.io/nvidia/deepstream:9.0-triton-multiarch
    container_name: headcount_deepstream
    ipc: host
    privileged: true
    depends_on:
      - redis
      - mediamtx
    environment:
      - REDIS_HOST=redis
      - NVIDIA_DRIVER_CAPABILITIES=all
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_CACHE_DISABLE=1
      - DISPLAY=
    volumes:
      - .:/workspace
      - ./recordings3:/workspace/recordings3
    command: bash /workspace/deepstream/start_ds.sh
    working_dir: /workspace/deepstream
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  amc-backend:
    image: nvcr.io/nvidia/auto-magic-calib:2.0.0
    container_name: headcount_amc_backend
    privileged: true
    ports:
      - "8001:8000"
    environment:
      - HOST_IP=127.0.0.1
      - NVIDIA_DRIVER_CAPABILITIES=all
      - NVIDIA_VISIBLE_DEVICES=all
      - PYTHONPATH=/home/auto-calibration-ms/server
    volumes:
      - ./recordings3:/recordings3
      - ./auto-magic-calib/GeoCalib:/home/auto-calibration-ms/submodules/GeoCalib
      - ./auto-magic-calib/GeoCalib/siclib:/home/auto-calibration-ms/submodules/GeoCalib/siclib
      - ./auto-magic-calib/projects:/home/auto-calibration-ms/server/projects
      - ./auto-magic-calib/models:/home/auto-calibration-ms/server/models
      - ./auto-magic-calib/compose/ms/preprocess_config.yaml:/home/auto-calibration-ms/configs/config_AutoMagicCalib/preprocess_config.yaml:ro
      - ./auto-magic-calib/compose/ms/mv_amc_config.yaml:/home/auto-calibration-ms/configs/config_AutoMagicCalib/mv_amc_config.yaml:ro
      - ./auto-magic-calib/compose/ms/convert_det2kitti.sh:/home/auto-calibration-ms/service_scripts/convert_det2kitti.sh:ro
    working_dir: /home/auto-calibration-ms/server
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  amc-ui:
    image: nvcr.io/nvidia/auto-magic-calib-ui:2.0.0
    container_name: headcount_amc_ui
    ports:
      - "5001:80"
    environment:
      - API_URL=http://localhost:8001/v1
      - VITE_API_URL=http://localhost:8001/v1
    depends_on:
      - amc-backend
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      network: host
    container_name: headcount_backend
    depends_on:
      - redis
      - deepstream
    environment:
      - REDIS_HOST=redis
      - DS_API_BASE=deepstream:8010
      - FLASK_ENV=production
    ports:
      - "8000:5000"  # Backend API mapped to 8000
      - "5002:5000"  # Frontend UI mapped to 5002
    volumes:
      - .:/app
      - ./data:/app/data
      - ./zones.json:/app/zones.json
    restart: unless-stopped
